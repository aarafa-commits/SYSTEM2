<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | MSME Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f0f4f8; min-height: 100vh; }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100%;
            background: linear-gradient(180deg, #1e4b2e 0%, #0f2e1e 100%);
            color: white;
            z-index: 100;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header { padding: 28px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h2 { font-size: 1.3rem; display: flex; align-items: center; gap: 10px; }
        .sidebar-header p { font-size: 0.7rem; opacity: 0.7; margin-top: 8px; }

        .nav-menu { padding: 24px 0; flex: 1; }

        .nav-item {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            transition: all 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.1);
            color: white;
            border-left: 4px solid #f59e0b;
        }

        .nav-item i { width: 24px; font-size: 1.2rem; }

        .user-info {
            margin-top: auto;
            padding: 20px 24px;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
        }

        .user-info .user-name { font-weight: 600; margin-bottom: 4px; }
        .user-info .user-role { font-size: 0.75rem; opacity: 0.7; }

        .logout-btn {
            margin-top: 12px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.3); }

        .main-content { margin-left: 280px; padding: 24px; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-title h1 { font-size: 1.8rem; color: #1f3b2c; }
        .page-title p { color: #6c7a89; margin-top: 4px; }

        .card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            margin-bottom: 28px;
            overflow: hidden;
        }

        .card-header {
            padding: 20px 28px;
            border-bottom: 2px solid #f0f2f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .card-header h2 {
            color: #1f3b2c;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-body { padding: 24px; }

        input, select {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            font-size: 0.95rem;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: #2c7a4a;
            outline: none;
            box-shadow: 0 0 0 3px rgba(44,122,74,0.1);
        }

        label { font-weight: 600; font-size: 0.85rem; color: #2c3e50; margin-bottom: 8px; display: block; }

        .form-group { margin-bottom: 18px; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 16px;
        }

        button {
            background: #2c7a4a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        button:hover { background: #1f5e3a; transform: translateY(-2px); }

        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-warning { background: #f59e0b; }
        .btn-warning:hover { background: #d97706; }
        .btn-small { padding: 7px 12px; font-size: 0.8rem; }
        .action-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #edf2f7; vertical-align: top; }
        th { background: #f8fafc; font-weight: 700; color: #1f3b2c; white-space: nowrap; }

        .badge { background:#e2e8f0; padding:3px 8px; border-radius:20px; display:inline-block; font-size:0.8rem; }
        .empty { text-align:center; padding:38px; color:#64748b; }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal {
            background: white;
            border-radius: 28px;
            max-width: 850px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 80px rgba(0,0,0,0.25);
        }

        .modal-header {
            padding: 22px 28px;
            border-bottom: 2px solid #f0f2f5;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:16px;
        }

        .modal-header h3 { color:#1f3b2c; }
        .modal-body { padding: 24px 28px; }
        .close-btn { background:#e2e8f0; color:#334155; padding:8px 12px; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .main-content { margin-left: 0; }
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-user-shield"></i> Admin Panel</h2>
            <p>MSME Production System Management</p>
        </div>

        <div class="nav-menu">
            <a href="admindashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i> Admin Dashboard</a>
            <a href="adminproducts.html" class="nav-item"><i class="fas fa-boxes"></i> Product Management</a>
            <a href="adminanalytics.html" class="nav-item"><i class="fas fa-chart-bar"></i> Admin Analytics</a>
            <a href="adminreports.html" class="nav-item"><i class="fas fa-file-alt"></i> Admin Reports</a>
            <a href="adminusers.html" class="nav-item active"><i class="fas fa-users-cog"></i> User Management</a>
        </div>

        <div class="user-info">
            <div class="user-name" id="userName">Loading...</div>
            <div class="user-role" id="userRole">Loading...</div>
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="page-title">
                <h1><i class="fas fa-users-cog"></i> User Management</h1>
                <p>Add, view, edit, and remove system users.</p>
            </div>

            <button onclick="openUserModal()"><i class="fas fa-user-plus"></i> Add New User</button>
        </div>

        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-users"></i> System Users</h2>
                <div>Total: <span id="userCount">0</span></div>
            </div>

            <div class="card-body table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" id="userModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="userModalTitle"><i class="fas fa-user-plus"></i> Add New User</h3>
                <button class="close-btn" onclick="closeUserModal()"><i class="fas fa-times"></i></button>
            </div>

            <div class="modal-body">
                <form id="userForm">
                    <input type="hidden" id="editingUserId">
                    <input type="hidden" id="editingUsername">

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" id="newUserName" required>
                        </div>

                        <div class="form-group">
                            <label>Username *</label>
                            <input type="text" id="newUsername" required autocomplete="off">
                        </div>

                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" id="newEmail" required autocomplete="off">
                        </div>

                        <div class="form-group">
                            <label>Password *</label>
                            <input type="text" id="newPassword" required autocomplete="off">
                        </div>

                        <div class="form-group">
                            <label>Role *</label>
                            <select id="newRole" required>
                                <option value="user">User / Staff</option>
                                <option value="manager">Manager</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </div>

                    <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:10px;">
                        <button type="submit"><i class="fas fa-save"></i> Save User</button>
                        <button type="button" class="close-btn" onclick="closeUserModal()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { firebaseService } from './firebase-config.js';

        let users = [];
        let sessionData = null;

        const defaultUsers = [
            { username: "admin", password: "admin123", role: "admin", name: "Administrator", email: "admin@msme.com" },
            { username: "user", password: "user123", role: "user", name: "Production Staff", email: "user@msme.com" },
            { username: "manager", password: "manager123", role: "manager", name: "Production Manager", email: "manager@msme.com" }
        ];

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, function(m) {
                return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
            });
        }

        function getArray(key) {
            try {
                const data = JSON.parse(localStorage.getItem(key) || '[]');
                return Array.isArray(data) ? data : [];
            } catch (error) {
                return [];
            }
        }

        function saveArray(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
        }

        function ensureDefaultUsers() {
            const stored = getArray('msme_users');
            const merged = [...stored];

            defaultUsers.forEach(defaultUser => {
                if (!merged.some(u => u.username === defaultUser.username)) {
                    merged.push(defaultUser);
                }
            });

            saveArray('msme_users', merged);
            return merged;
        }

        function checkAdminAuth() {
            try {
                sessionData = JSON.parse(localStorage.getItem('msme_production_session') || 'null');
            } catch (error) {
                sessionData = null;
            }

            if (!sessionData || !sessionData.loggedIn) {
                window.location.href = 'login.html';
                return false;
            }

            if (sessionData.role !== 'admin') {
                alert('Admin access only.');
                window.location.href = 'dashboard.html';
                return false;
            }

            document.getElementById('userName').innerText = sessionData.name || sessionData.username || 'Admin';
            document.getElementById('userRole').innerText = 'ADMIN';

            return true;
        }

        function logout() {
            localStorage.removeItem('msme_production_session');
            window.location.href = 'login.html';
        }

        async function loadData() {
            // Load users from Firebase
            try {
                const result = await firebaseService.getUsersFromFirebase();
                if (result.success && result.data.length > 0) {
                    // Convert Firebase users to our format
                    users = result.data.map(user => ({
                        id: user.id,
                        username: user.username || '',
                        name: user.name || '',
                        email: user.email || '',
                        role: user.role || 'user',
                        password: user.password || '********'
                    }));
                } else {
                    // Fallback to localStorage
                    users = ensureDefaultUsers();
                }
            } catch (error) {
                console.error('Error loading users from Firebase:', error);
                // Fallback to localStorage
                users = ensureDefaultUsers();
            }
            
            renderUsersTable();
        }

        function renderUsersTable() {
            const tbody = document.getElementById('usersTableBody');
            document.getElementById('userCount').innerText = users.length;

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty">No users found.</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td><strong>${escapeHtml(user.name || '')}</strong></td>
                    <td>${escapeHtml(user.username || '')}</td>
                    <td>${escapeHtml(user.email || '')}</td>
                    <td><span class="badge">${escapeHtml(user.role || '')}</span></td>
                    <td>
                        <div class="action-group">
                            <button class="btn-small btn-warning" onclick="editUser('${escapeHtml(user.id || user.username)}')">
                                <i class="fas fa-edit"></i> Edit
                            </button>

                            <button class="btn-small btn-danger" onclick="deleteUser('${escapeHtml(user.id || user.username)}')" ${user.username === sessionData.username ? 'disabled style="opacity:.5; cursor:not-allowed;"' : ''}>
                                <i class="fas fa-user-times"></i> Remove
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function openUserModal() {
            document.getElementById('userForm').reset();
            document.getElementById('editingUserId').value = '';
            document.getElementById('editingUsername').value = '';
            document.getElementById('newUsername').disabled = false;
            document.getElementById('newEmail').disabled = false;
            document.getElementById('newRole').disabled = false;
            document.getElementById('userModalTitle').innerHTML = '<i class="fas fa-user-plus"></i> Add New User';
            document.getElementById('userModal').style.display = 'flex';
        }

        function closeUserModal() {
            document.getElementById('userModal').style.display = 'none';
            document.getElementById('userForm').reset();
            document.getElementById('editingUserId').value = '';
            document.getElementById('editingUsername').value = '';
            document.getElementById('newUsername').disabled = false;
            document.getElementById('newEmail').disabled = false;
            document.getElementById('newRole').disabled = false;
        }

        function editUser(identifier) {
            // Find user by id or username
            const user = users.find(u => (u.id === identifier || u.username === identifier));

            if (!user) {
                alert('User not found.');
                return;
            }

            document.getElementById('userForm').reset();
            document.getElementById('editingUserId').value = user.id || '';
            document.getElementById('editingUsername').value = user.username || '';
            document.getElementById('newUserName').value = user.name || '';
            document.getElementById('newUsername').value = user.username || '';
            document.getElementById('newEmail').value = user.email || '';
            document.getElementById('newPassword').value = user.password || '';
            document.getElementById('newRole').value = user.role || 'user';
            document.getElementById('userModalTitle').innerHTML = '<i class="fas fa-edit"></i> Edit User';
            document.getElementById('userModal').style.display = 'flex';
        }

        document.getElementById('userForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const editingUserId = document.getElementById('editingUserId').value.trim();
            const editingUsername = document.getElementById('editingUsername').value.trim();
            const name = document.getElementById('newUserName').value.trim();
            const username = document.getElementById('newUsername').value.trim();
            const email = document.getElementById('newEmail').value.trim();
            const password = document.getElementById('newPassword').value.trim();
            const role = document.getElementById('newRole').value;

            if (!name || !username || !email || !password || !role) {
                alert('Please complete all user fields.');
                return;
            }

            if (editingUserId) {
                // Editing existing user
                const userIndex = users.findIndex(u => u.id === editingUserId || u.username === editingUsername);

                if (userIndex === -1) {
                    alert('User not found.');
                    return;
                }

                const oldUser = users[userIndex];

                // Prevent removing the last admin
                if (oldUser.role === 'admin' && role !== 'admin') {
                    const adminCount = users.filter(u => u.role === 'admin').length;

                    if (adminCount <= 1) {
                        alert('You cannot change the last admin account to another role.');
                        return;
                    }
                }

                // Update in Firebase
                try {
                    const updateData = {
                        name: name,
                        username: username,
                        email: email,
                        role: role
                    };
                    
                    // Only update password if it's changed
                    if (password !== '********' && password !== oldUser.password) {
                        updateData.password = password;
                    }

                    await firebaseService.updateUserInFirebase(editingUserId, updateData);
                    
                    // Update local array
                    users[userIndex] = {
                        ...oldUser,
                        name,
                        username,
                        email,
                        role,
                        password: password !== '********' ? password : oldUser.password
                    };

                    // Update session if editing own account
                    if (sessionData && String(sessionData.username) === String(editingUsername)) {
                        sessionData.username = username;
                        sessionData.name = name;
                        sessionData.role = role;
                        sessionData.loggedIn = true;
                        localStorage.setItem('msme_production_session', JSON.stringify(sessionData));

                        document.getElementById('userName').innerText = name || username || 'Admin';
                        document.getElementById('userRole').innerText = String(role).toUpperCase();

                        if (role !== 'admin') {
                            alert('Your account role was changed. Admin access will end.');
                            window.location.href = 'dashboard.html';
                            return;
                        }
                    }

                    closeUserModal();
                    await loadData();
                    alert('User updated successfully.');
                } catch (error) {
                    alert('Error updating user: ' + error.message);
                }
                return;
            }

            // Adding new user
            if (users.some(u => u.username === username)) {
                alert('Username already exists.');
                return;
            }

            if (users.some(u => u.email === email)) {
                alert('Email already exists.');
                return;
            }

            try {
                // Create user in Firebase
                const result = await firebaseService.createUserWithFirebase(email, password, {
                    username: username,
                    name: name,
                    role: role
                });

                if (result.success) {
                    // Add to local array
                    users.push({
                        id: result.user.uid,
                        username: username,
                        name: name,
                        email: email,
                        password: password,
                        role: role
                    });

                    closeUserModal();
                    await loadData();
                    alert('New user added successfully.');
                } else {
                    alert('Error creating user: ' + result.error);
                }
            } catch (error) {
                alert('Error creating user: ' + error.message);
            }
        });

        async function deleteUser(identifier) {
            // Find user by id or username
            const target = users.find(u => (u.id === identifier || u.username === identifier));
            
            if (!target) {
                alert('User not found.');
                return;
            }

            if (target.username === sessionData.username) {
                alert('You cannot remove your own account while logged in.');
                return;
            }

            // Prevent removing the last admin
            if (target.role === 'admin') {
                const adminCount = users.filter(u => u.role === 'admin').length;

                if (adminCount <= 1) {
                    alert('You cannot remove the last admin account.');
                    return;
                }
            }

            if (!confirm(`Remove user "${target.username}"?`)) return;

            try {
                // Delete from Firebase
                await firebaseService.deleteUserFromFirebase(target.id);
                
                // Remove from local array
                users = users.filter(u => u.id !== target.id && u.username !== target.username);
                
                await loadData();
                alert('User removed successfully.');
            } catch (error) {
                alert('Error deleting user: ' + error.message);
            }
        }

        // Set up logout button
        document.getElementById('logoutBtn').addEventListener('click', function() {
            logout();
        });

        document.getElementById('userModal').addEventListener('click', function(event) {
            if (event.target === this) {
                closeUserModal();
            }
        });

        if (checkAdminAuth()) {
            loadData();
        }

        // Make functions globally accessible for inline onclick
        window.logout = logout;
        window.openUserModal = openUserModal;
        window.closeUserModal = closeUserModal;
        window.editUser = editUser;
        window.deleteUser = deleteUser;
        window.loadData = loadData;
    </script>
</body>
</html>
